[project]
name = "toolshed"
# Read from toolshed/__init__.py so the wheel, --version, artifact names,
# the Inno Setup AppVersion and the Windows VERSIONINFO cannot drift apart.
dynamic = ["version"]
description = "Local AI, set up for you. A hand-holding installer for ComfyUI on Linux and Windows."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }

# Runtime dependencies of the INSTALLER APP only. ComfyUI and PyTorch are not
# listed here on purpose: they are installed into a separate, user-owned venv at
# install time by uv, and are never imported by this process.
dependencies = [
    "PySide6-Essentials>=6.9",
    "httpx>=0.28",
    # Easy mode's progress bar. ComfyUI reports per-node progress only over its
    # /ws endpoint -- there is no HTTP equivalent -- and PySide6-Essentials
    # does not ship QtWebSockets (checked: the wheel has QtNetwork but no
    # QtWebSockets), so a websocket client has to come from somewhere. Pure
    # Python, no PyInstaller hook needed.
    "websockets>=13",
    "PyYAML>=6.0",
    "pydantic>=2.9",
    "psutil>=6.0",
    "keyring>=25.0",
    "cryptography>=44.0",       # ed25519 catalogue verification
]
# Deliberately NOT a dependency: huggingface-hub. docs/PLAN.md uses it for
# metadata only -- two REST calls httpx already covers -- but its public API is
# lazy __getattr__-based, so PyInstaller's module graph sees nothing and it has
# no hook. It also drags in the compiled hf_xet plus fsspec, tqdm and filelock.
# Adding it back means owning a collect_submodules + copy_metadata hook.

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8", "mypy>=1.13"]

[project.scripts]
toolshed = "toolshed.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "toolshed/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["toolshed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# PyInstaller spec files are Python and would otherwise go unlinted.
extend-include = ["*.spec"]
extend-exclude = [".cache", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["toolshed"]

[tool.ruff.lint.per-file-ignores]
# Spec files use globals PyInstaller injects at exec time: SPECPATH, Analysis,
# Tree, PYZ, EXE, COLLECT. Ruff cannot see them and reports every one as F821.
# E402: the shared-config import must follow the sys.path insert that makes it
# resolvable, because a spec is exec'd, not imported.
"*.spec" = ["F821", "E402"]
