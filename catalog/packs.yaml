# What the user actually chooses from, in their words.
#
# This file is HAND-WRITTEN and holds only human-facing text plus the hardware
# floor for each pack. Everything machine-checkable -- model filenames,
# destination folders, download sizes -- stays in catalog/recipes/*.generated.yaml,
# which is derived from Comfy Org's official templates by tools/derive_catalog.py.
# `recipe` below is the link between the two, and the loader reads the download
# size from the generated file so the number can never drift from ground truth.
#
# `adult: true` moves a pack out of the modality groups and behind the gate on
# the choose screen. It may never be `default_checked` -- the loader refuses the
# catalogue outright if it is. No such pack exists yet: the model has not been
# chosen and its facts are not frozen. See docs/ADULT-PACKS.md.
#
# VRAM floors marked provisional are engineering estimates, not measurements.
# docs/PLAN.md M0 replaces them with real numbers taken on real cards. They are
# deliberately conservative: offering a pack that then fails is worse than
# hiding one that might have worked.

schema_version: 1

packs:
  - id: image.zimage
    modality: Pictures
    name: "Make pictures"
    blurb: "Describe a picture and get one back in a few seconds. The best place to start."
    recipe: image_z_image_turbo_int8
    vram_gb_min: 8          # provisional
    licence: "Apache 2.0 — free for any use, including commercial."
    default_checked: true
    # UNVERIFIED, and it matters more than anything else here: on a 20 GB
    # gfx1100 this pack returned a flat, featureless square for every prompt
    # tried, including a plainly benign one. No error -- a finished image with
    # nothing in it, which is what a NaN latent decodes to.
    #
    # A first guess blamed the fp8 text encoder, because that card logs
    # "emulated ops: float8_e5m2, mxfp8, float8_e4m3fn, nvfp4" and this
    # recipe's encoder is qwen_3_4b_fp8_mixed. THAT GUESS IS WRONG, and the
    # source says so: comfy/sd1_clip.py builds a text encoder with
    # mixed_precision_ops(..., full_precision_mm=True) and no `disabled` set,
    # while the "emulated ops" line comes from pick_operations in comfy/ops.py,
    # which only ever runs for a DIFFUSION model config. A text encoder never
    # reaches that code path, so fp8 emulation cannot be changing its numerics.
    #
    # The proposed experiment was wrong too: SDXL differs from this pack in
    # encoder, sampler shift, VAE and diffusion model all at once, so a picture
    # from it would have isolated nothing.
    #
    # Still unexplained, therefore, and still the pack that is default_checked
    # and called "the best place to start" on a vendor that is a fixed
    # constraint (docs/PLAN.md D2). What would actually narrow it, in order:
    # run the bf16 recipe (image_z_image_turbo) -- same graph, same sampler,
    # only the quantisation differs, which is the single-variable test; and
    # check whether the run logs "Using MixedPrecisionOps for text encoder"
    # WITHOUT an accompanying "emulated ops" line, which would confirm the two
    # come from different call sites.

  - id: image.sdxl
    modality: Pictures
    name: "Make pictures (classic model)"
    blurb: "Older and a little slower, but it fits on smaller graphics cards and has a huge
            library of community add-ons."
    recipe: image_sdxl_simple
    vram_gb_min: 6          # provisional
    licence: "CreativeML OpenRAIL++-M — free to use, with conditions on how you use it."
    default_checked: false

  - id: image.qwen_edit
    modality: Pictures
    name: "Edit a picture"
    blurb: "Change something in a photo by describing the change. Large download and needs a
            big graphics card."
    recipe: image_qwen_image_edit_2511_int8
    vram_gb_min: 16         # provisional
    licence: "Apache 2.0 — free for any use, including commercial."
    default_checked: false

  - id: video.wan22
    modality: Video
    name: "Make short videos"
    blurb: "Text to video, and picture to video. A few seconds of footage takes a few minutes."
    recipe: video_wan2_2_5B_ti2v
    vram_gb_min: 8          # provisional
    licence: "Apache 2.0 — free for any use, including commercial."
    default_checked: false

  - id: audio.acestep
    modality: Music
    name: "Make music"
    blurb: "Describe a style and add your own lyrics to get a full song."
    recipe: audio_ace_step_1_5_checkpoint
    vram_gb_min: 8          # provisional
    licence: "Apache 2.0 — free for any use, including commercial."
    default_checked: false

  - id: model3d.trellis2
    modality: 3D models
    name: "Turn a photo into a 3D model"
    blurb: "Upload one picture of an object and get a textured 3D model you can open in Blender."
    recipe: 3d_pixal3d_trellis2_image_to_model
    vram_gb_min: 10         # provisional
    licence: "MIT — free for any use, including commercial."
    default_checked: false
    # Nobody has published a working result for this on AMD. The setup smoke
    # test decides per machine; see docs/PLAN.md section 10.
    #
    # MEASURED, and the floor above is now known to be wrong: on a 20 GB
    # gfx1100 this ran for three minutes and died out of memory in
    # VaeDecodeShapeTrellis, with six models resident on the card at once
    # (BiRefNet, MoGe, DINOv3, NAF, Trellis2, ShapeVae -- 15.09 GB allocated,
    # 3.19 GB reserved but fragmented). 10 GB cannot be right when 20 GB is
    # not enough.
    #
    # Deliberately not raised yet: that run predates both the allocator
    # setting in engine.py and --disable-smart-memory, either of which may
    # bring it back inside 20 GB. Re-measure with those before picking a
    # number, and do not guess one in the meantime.
    #
    # UPDATE, same card, with the allocator setting and all three safeguards:
    # the VaeDecodeShapeTrellis failure is GONE -- shape, structure and texture
    # stages all completed. It now reaches UnwrapMesh and fails there with
    # HIPBLAS_STATUS_ALLOC_FAILED on a 3.04M-vertex, 6.17M-face mesh, 101
    # seconds in. So the memory work helped and the pack still does not finish
    # on a 20 GB gfx1100.
    #
    # SETTLED, by running it. The UnwrapMesh failure is not memory and not
    # mesh size: HIPBLAS_STATUS_ALLOC_FAILED at 2005 charts, at 1012 and at
    # 756, taking 101s then 0.40s then 1.81s, always at 0% of the first pass,
    # with 19.8 GB free and 2 MB held by torch. Cutting the mesh by two thirds
    # changed only how fast it failed.
    #
    # The cause is upstream and outside our reach. hipblasDgetrfBatched is a
    # double-precision batched LU that gfx1100 does not provide, and
    # comfy_extras/mesh3d/uv_unwrap/parameterize.py chooses its GPU branch on
    #
    #     use_gpu = device is not None and device.type == "cuda"
    #
    # with device=comfy.model_management.get_torch_device() -- on device type
    # alone, never on whether the routine works. A complete numpy fallback sits
    # in the else branch and this card can never reach it. Only --cpu changes
    # that device, and that puts diffusion on the processor too, which is not a
    # trade anyone would take.
    #
    # So TRELLIS.2 cannot finish on gfx1100 with ComfyUI v0.34.0. Everything up
    # to the unwrap works -- shape, structure and texture all complete, and the
    # mesh is built -- but the pack cannot produce a textured .glb.
    #
    # This is what experimental_on and the setup smoke test were for. The pack
    # should stop being offered on AMD until upstream picks the CPU path when
    # the GPU one is unavailable; that is a scope decision for the owner, so
    # the flag below is unchanged and this is the evidence for making it.
    experimental_on: [amd]
