# What the user actually chooses from, in their words.
#
# This file is HAND-WRITTEN and holds only human-facing text plus the hardware
# floor for each pack. Everything machine-checkable -- model filenames,
# destination folders, download sizes -- stays in catalog/recipes/*.generated.yaml,
# which is derived from Comfy Org's official templates by tools/derive_catalog.py.
# `recipe` below is the link between the two, and the loader reads the download
# size from the generated file so the number can never drift from ground truth.
#
# `adult: true` moves a pack out of the modality groups and behind the gate on
# the choose screen. It may never be `default_checked` -- the loader refuses the
# catalogue outright if it is. See docs/ADULT-PACKS.md.
#
# A pack whose recipe is not frozen is SHOWN and greyed out with the reason,
# the same as one too big for the card. It used to be absent entirely, which
# made an unfinished feature look like a missing one.
#
# VRAM floors marked provisional are engineering estimates, not measurements.
# docs/PLAN.md M0 replaces them with real numbers taken on real cards. They are
# deliberately conservative: offering a pack that then fails is worse than
# hiding one that might have worked.

schema_version: 1

packs:
  - id: image.zimage
    modality: Pictures
    name: "Make pictures"
    blurb: "Describe a picture and get one back in a few seconds. The best place to start."
    recipe: image_z_image_turbo_int8
    vram_gb_min: 8          # provisional
    licence: "Apache 2.0 — free for any use, including commercial."
    default_checked: true
    # UNVERIFIED, and it matters more than anything else here: on a 20 GB
    # gfx1100 this pack returned a flat, featureless square for every prompt
    # tried, including a plainly benign one. No error -- a finished image with
    # nothing in it, which is what a NaN latent decodes to.
    #
    # A first guess blamed the fp8 text encoder, because that card logs
    # "emulated ops: float8_e5m2, mxfp8, float8_e4m3fn, nvfp4" and this
    # recipe's encoder is qwen_3_4b_fp8_mixed. THAT GUESS IS WRONG, and the
    # source says so: comfy/sd1_clip.py builds a text encoder with
    # mixed_precision_ops(..., full_precision_mm=True) and no `disabled` set,
    # while the "emulated ops" line comes from pick_operations in comfy/ops.py,
    # which only ever runs for a DIFFUSION model config. A text encoder never
    # reaches that code path, so fp8 emulation cannot be changing its numerics.
    #
    # The proposed experiment was wrong too: SDXL differs from this pack in
    # encoder, sampler shift, VAE and diffusion model all at once, so a picture
    # from it would have isolated nothing.
    #
    # Still unexplained, therefore, and still the pack that is default_checked
    # and called "the best place to start" on a vendor that is a fixed
    # constraint (docs/PLAN.md D2). What would actually narrow it, in order:
    # run the bf16 recipe (image_z_image_turbo) -- same graph, same sampler,
    # only the quantisation differs, which is the single-variable test; and
    # check whether the run logs "Using MixedPrecisionOps for text encoder"
    # WITHOUT an accompanying "emulated ops" line, which would confirm the two
    # come from different call sites.

  - id: image.sdxl
    modality: Pictures
    name: "Make pictures (classic model)"
    blurb: "Older and a little slower, but it fits on smaller graphics cards and has a huge
            library of community add-ons."
    recipe: image_sdxl_simple
    vram_gb_min: 6          # provisional
    licence: "CreativeML OpenRAIL++-M — free to use, with conditions on how you use it."
    default_checked: false

  - id: image.qwen_edit
    modality: Pictures
    name: "Edit a picture"
    blurb: "Change something in a photo by describing the change. Large download and needs a
            big graphics card."
    recipe: image_qwen_image_edit_2511_int8
    vram_gb_min: 16         # provisional
    licence: "Apache 2.0 — free for any use, including commercial."
    default_checked: false

  - id: video.wan22
    modality: Video
    name: "Make short videos"
    blurb: "Text to video, and picture to video. A few seconds of footage takes a few minutes."
    recipe: video_wan2_2_5B_ti2v
    vram_gb_min: 8          # provisional
    licence: "Apache 2.0 — free for any use, including commercial."
    default_checked: false

  - id: video.wan22_14b
    modality: Video
    name: "Make short videos (big model)"
    blurb: "The much larger 14B model. Better looking video, a 38 GB download, and it needs
            layer streaming switched on to run on a normal graphics card."
    recipe: video_wan2_2_14B_t2v
    vram_gb_min: 8          # provisional -- see the note below, this is not the real limit
    licence: "Apache 2.0 — free for any use, including commercial."
    default_checked: false
    # Added because layer streaming changed what is reachable. The earlier
    # judgement -- that 14B was out because the catalogue sits on an 8 GB VRAM
    # floor -- was reasoning from a constraint that no longer holds: with
    # --novram almost no weights stay resident, so the card stops being the
    # thing that decides.
    #
    # Everything in it is Comfy Org's own repackage, derived from the official
    # video_wan2_2_14B_t2v template. Nothing community, nothing hand-picked:
    #
    #   wan2.2_t2v_high_noise_14B_fp8_scaled.safetensors  diffusion_models
    #   wan2.2_t2v_low_noise_14B_fp8_scaled.safetensors   diffusion_models
    #   umt5_xxl_fp8_e4m3fn_scaled.safetensors            text_encoders
    #   wan_2.1_vae.safetensors                           vae
    #   wan2.2_t2v_lightx2v_4steps_lora_v1.1_{high,low}_noise.safetensors  loras
    #
    # Three things make it more plausible on a 20 GB card than the raw size
    # suggests. The experts are fp8_scaled rather than bf16. The high-noise and
    # low-noise experts run in sequence, not together, so the peak is one of
    # them. And the two Lightning LoRAs cut sampling to four steps, which is
    # what makes streaming affordable -- the weights cross the bus four times
    # rather than twenty.
    #
    # The floor above is provisional and probably the wrong axis. With
    # streaming the binding constraint is SYSTEM RAM, not VRAM, and the machine
    # that prompted this has 31 GB. Nobody has measured it yet. Measure before
    # trusting the number, and the honest floor may need to be a RAM floor,
    # which the schema does not currently have.

  - id: audio.acestep
    modality: Music
    name: "Make music"
    blurb: "Describe a style and add your own lyrics to get a full song."
    recipe: audio_ace_step_1_5_checkpoint
    vram_gb_min: 8          # provisional
    licence: "Apache 2.0 — free for any use, including commercial."
    default_checked: false

  - id: model3d.trellis2
    modality: 3D models
    name: "Turn a photo into a 3D model"
    blurb: "Upload one picture of an object and get a textured 3D model you can open in Blender."
    recipe: 3d_pixal3d_trellis2_image_to_model
    vram_gb_min: 10         # provisional
    licence: "MIT — free for any use, including commercial."
    default_checked: false
    # Nobody has published a working result for this on AMD. The setup smoke
    # test decides per machine; see docs/PLAN.md section 10.
    #
    # MEASURED, and the floor above is now known to be wrong: on a 20 GB
    # gfx1100 this ran for three minutes and died out of memory in
    # VaeDecodeShapeTrellis, with six models resident on the card at once
    # (BiRefNet, MoGe, DINOv3, NAF, Trellis2, ShapeVae -- 15.09 GB allocated,
    # 3.19 GB reserved but fragmented). 10 GB cannot be right when 20 GB is
    # not enough.
    #
    # Deliberately not raised yet: that run predates both the allocator
    # setting in engine.py and --disable-smart-memory, either of which may
    # bring it back inside 20 GB. Re-measure with those before picking a
    # number, and do not guess one in the meantime.
    #
    # UPDATE, same card, with the allocator setting and all three safeguards:
    # the VaeDecodeShapeTrellis failure is GONE -- shape, structure and texture
    # stages all completed. It now reaches UnwrapMesh and fails there with
    # HIPBLAS_STATUS_ALLOC_FAILED on a 3.04M-vertex, 6.17M-face mesh, 101
    # seconds in. So the memory work helped and the pack still does not finish
    # on a 20 GB gfx1100.
    #
    # SETTLED, by running it. The UnwrapMesh failure is not memory and not
    # mesh size: HIPBLAS_STATUS_ALLOC_FAILED at 2005 charts, at 1012 and at
    # 756, taking 101s then 0.40s then 1.81s, always at 0% of the first pass,
    # with 19.8 GB free and 2 MB held by torch. Cutting the mesh by two thirds
    # changed only how fast it failed.
    #
    # The cause is upstream and outside our reach. hipblasDgetrfBatched is a
    # double-precision batched LU that gfx1100 does not provide, and
    # comfy_extras/mesh3d/uv_unwrap/parameterize.py chooses its GPU branch on
    #
    #     use_gpu = device is not None and device.type == "cuda"
    #
    # with device=comfy.model_management.get_torch_device() -- on device type
    # alone, never on whether the routine works. A complete numpy fallback sits
    # in the else branch and this card can never reach it. Only --cpu changes
    # that device, and that puts diffusion on the processor too, which is not a
    # trade anyone would take.
    #
    # So TRELLIS.2 cannot finish on gfx1100 with ComfyUI v0.34.0. Everything up
    # to the unwrap works -- shape, structure and texture all complete, and the
    # mesh is built -- but the pack cannot produce a textured .glb.
    #
    # This is what experimental_on and the setup smoke test were for. The pack
    # should stop being offered on AMD until upstream picks the CPU path when
    # the GPU one is unavailable; that is a scope decision for the owner, so
    # the flag below is unchanged and this is the evidence for making it.
    experimental_on: [amd]

  # --- adult ---------------------------------------------------------------
  # Behind the age gate on the choose screen; never in the Pictures group and
  # never pre-ticked. INSTALLABLE, on the owner's explicit instruction, with
  # its recipe still unfrozen.
  #
  # That was three positions in a row: absent from the catalogue, then greyed
  # out, now installable with the unknowns on the row. The middle one was
  # defended with a claim that does not survive reading the other recipes --
  # "the download has not been checked against its publisher". Neither has
  # image_sdxl_simple's. Every pack we ship carries sha256: PENDING_FREEZE and
  # size_bytes: PENDING_FREEZE and resolves both from the publisher at install
  # time; see planner/plan.py Download. The only thing this pack really lacked
  # was estimated_download_bytes, a number for the confirmation screen.
  #
  # What is genuinely unverified, and what the row now says: nobody has
  # confirmed from here that the repo and filename resolve, because this
  # environment has no route to Hugging Face (the gateway refuses CONNECT to
  # huggingface.co:443). If the publisher has renamed the file the download
  # fails and says so. Nothing here invents a hash or a size to paper over it.
  #
  # Still worth doing on a machine that can reach the API:
  #
  #     python3 tools/freeze_manifest.py catalog/recipes/image_sdxl_adult.authored.yaml
  #
  # The model is named in the recipe (fancyfeast/big-asp-v2, an SDXL
  # photographic finetune that drops into the SDXL graph we already ship).
  - id: image.sdxl_adult
    modality: Pictures
    name: "Make pictures (adult)"
    blurb: "Explicit images. Uses the same picture workflow as the classic model, with a
            model trained for it. Off unless you turn it on."
    recipe: image_sdxl_adult
    vram_gb_min: 6          # provisional, matching image.sdxl -- same graph, same size model
    licence: "PENDING_FREEZE — read from the model card when the recipe is frozen."
    adult: true

  - id: image.liberty_adult
    modality: Pictures
    name: "Make pictures (adult, Liberty)"
    blurb: "An older community model, explicit by default — its author warns you can get
            explicit pictures from prompts that did not ask for them. Small and quick, and
            it runs on almost any card. Off unless you turn it on."
    recipe: image_liberty_adult
    # From the card: minimum 1.4 GB, recommended 3.2 GB. 4 is the nearest floor
    # the schema offers above the recommendation, and this is an SD 1.5 model
    # at 512x512 -- by a wide margin the smallest thing in the catalogue.
    vram_gb_min: 4
    licence: "The author says free for any purpose, commercial or not — but it merges 23+
              community models, so check the credits before you rely on that."
    # The author's own warning, on the row, before it is ticked. This is the
    # most surprising thing the pack can do and it should surprise nobody.
    caution: "Its author calls this an \"extremely NSFW biased model\" and warns you can
              get explicit pictures from prompts that did not ask for them — so do not run
              it where someone might be looking over your shoulder. They have also stopped
              developing it, say it is not a good model for beginners, and it is not
              intended for anime. Nothing about this download was checked from here."
    adult: true
    # Chosen by the owner, who supplied the model page. Everything below is the
    # publisher's own text, recorded because it bears on the recommendation:
    #
    # * The author has DEPRECATED it and points at Requiem instead. We ship a
    #   model its own maker suggests replacing.
    # * "Extremely NSFW biased model!!! ... Use it at your own risk of getting
    #   unprompted explicit images." That is why the blurb leads with it: a
    #   tame prompt returning an explicit picture is the single most surprising
    #   thing this pack can do, and it should surprise nobody who ticked it.
    # * "This is not an easy to prompt model, nor the best one for begginers."
    #   The author's own words about an app for beginners. Recorded rather than
    #   argued with; the START HERE note passes the warning on.
    # * It answers the male-anatomy request more directly than big-asp-v2 does
    #   -- AIrotic Arts' penis model and Homoerotic v2 are in its credits, and
    #   two of its trigger words name it. That is intent, not a measured
    #   result; the contact sheet in docs/ADULT-PACKS.md still decides.
    # * It does NOT answer the anime request: "it won't make the best anime art
    #   out there either", says the author.
    #
    # It is SD 1.5, so it gets its own 512x512 workflow rather than the SDXL
    # graph -- see the recipe. Nothing here was verified against Civitai; this
    # environment cannot reach it.
