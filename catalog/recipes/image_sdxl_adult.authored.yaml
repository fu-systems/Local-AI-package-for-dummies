# HAND-AUTHORED, not derived. See docs/ADULT-PACKS.md.
#
# The graph is Comfy Org's image_sdxl_simple template, unchanged -- an SDXL
# finetune is a drop-in for the same workflow, so nothing here diverges from
# upstream except which checkpoint file gets downloaded. That is why this is
# the only recipe not produced by tools/derive_catalog.py: there is no upstream
# template for this model, because the model is not in one.
#
# ---------------------------------------------------------------------------
# NOT YET FROZEN. Run this on a machine that can reach Hugging Face:
#
#     python3 tools/freeze_manifest.py catalog/recipes/image_sdxl_adult.authored.yaml
#
# It fills in revision, sha256, size_bytes, gated and licence, and the download
# total from the sum -- and it verifies the repo and path below while doing so,
# because paths-info either returns that exact file or it does not. Anything it
# cannot read stays PENDING_FREEZE rather than becoming a plausible wrong value.
#
# Then fill in name, blurb and the variant label (the tool never writes a human
# field), add the pack row to catalog/packs.yaml -- the shape is in
# docs/ADULT-PACKS.md -- and the gate on the choose screen picks it up with no
# code change at all.
# ---------------------------------------------------------------------------

schema_version: 1
id: image.sdxl_adult
name: PENDING_FREEZE
blurb: PENDING_FREEZE
modality: Pictures
default_checked: false

requires:
  comfyui_min: 0.0.1
  vendors:
  - nvidia
  - amd
  # The same graph as image_sdxl_simple, so the same node classes. Regenerated
  # by lint from the authored api.json rather than kept by hand -- invariant 10
  # in docs/PLAN.md -- once that workflow triple exists.
  node_classes:
  - CLIPTextEncode
  - CheckpointLoaderSimple
  - EmptyLatentImage
  - KSampler
  - SaveImage
  - VAEDecode

licence:
  id: PENDING_FREEZE
  # Adult packs always gate, whatever the licence says: the gate here is the
  # age confirmation on the choose screen, not a licence acceptance. A pack
  # with `adult: true` can never be default_checked -- the loader refuses the
  # catalogue outright if it is.
  gate: notice

custom_nodes: []
estimated_download_bytes: PENDING_FREEZE

variants:
- id: PENDING_FREEZE
  label: PENDING_FREEZE
  when:
    vram_gb_min: PENDING_FREEZE
  files:
  - checkpoint

files:
  checkpoint:
    source: huggingface
    # bigASP v2: an SDXL finetune on several million photographs, so a drop-in
    # for the graph above. Against the criteria in docs/ADULT-PACKS.md:
    #
    #   1 huggingface.co                                          yes
    #   2 the author's own repo, not a mirror                      yes -- fancyfeast
    #     (John6666/... and silveroxides/... are reuploads; a mirror can be
    #      replaced under a frozen hash, which is the whole point of freezing)
    #   3 .safetensors                                             yes
    #   4 gated?                                                   freeze reads it
    #   5 licence                                                  freeze reads it
    #   6 competent at male and female anatomy                     NOT ESTABLISHED
    #   7 not a booru/anime finetune                               yes -- v2 is
    #     photographic. v2.5 added anime, so v2 is the deliberate choice here.
    #
    # Criterion 6 is the one the two users who asked for this actually cared
    # about, and nothing on a model card answers it. It needs the contact sheet
    # in docs/ADULT-PACKS.md. If this model cannot do it, the recipe grows a
    # LoRA rather than changing checkpoint -- the mechanism is already proven,
    # image_qwen_image_edit_2511_int8 ships one.
    #
    # The three values below came from search rather than the API, because
    # Hugging Face was unreachable when they were written. They are a proposal,
    # not a frozen fact: tools/freeze_manifest.py asks paths-info for exactly
    # this repo and path, and if either is wrong it finds nothing and leaves
    # sha256 and size_bytes PENDING_FREEZE rather than inventing them. A wrong
    # guess here fails loudly at freeze time, on a machine that can check.
    repo: fancyfeast/big-asp-v2
    revision: PENDING_FREEZE
    path: cuwm1gxo-complete-20241024a.safetensors
    dest: checkpoints
    filename: cuwm1gxo-complete-20241024a.safetensors
    sha256: PENDING_FREEZE
    size_bytes: PENDING_FREEZE
    gated: PENDING_FREEZE
    licence: PENDING_FREEZE
    from_node: CheckpointLoaderSimple

workflows:
- id: PENDING_FREEZE
  title: Text to picture, adult
  inject_as: PENDING_FREEZE
  # The graph is the SDXL template. Only the checkpoint the loader points at
  # differs, and that is written by the installer from `files` above.
  derived_from:
    repo: Comfy-Org/workflow_templates
    commit: PENDING_FREEZE
    template: image_sdxl_simple
  shape: flat
  bind_mode: node_ids
  bind: {}

presets: []
