name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # A hung step must not burn six hours of runner time.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      # checkout@v4 and setup-python@v5 are node20, which the runners already
      # force-migrate to node24 with a deprecation warning. Pinned to node24
      # majors so the removal is a non-event.
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Qt needs these to import at all, even headless. Without them the UI
      # tests skip silently, which is how thirteen tests guarding the wizard
      # flow came to be not running in CI while appearing green.
      - name: Install the libraries Qt needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libglib2.0-0 libxkbcommon0 libxcb-cursor0

      # Install the project, never a hand-typed list of package names. That
      # list drifted from pyproject.toml three times -- pyyaml, then PySide6,
      # then httpx -- and each time the failure landed on main, because the
      # build workflows do `pip install .` and had the dependency while CI did
      # not. One source of truth, and adding a dependency needs no CI edit.
      #
      # -e here, unlike the builds, on purpose: tests must exercise the working
      # tree, not a copy of it installed into site-packages.
      - name: Install the project and its dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Qt must be importable
        # A guard, not a formality. The UI tests use pytest.importorskip, so a
        # missing PySide6 turns them into a silent skip rather than a failure.
        # Fail loudly here instead.
        run: python -c "import PySide6; print('PySide6', PySide6.__version__)"

      # `ruff check .` rather than named directories. Ruff respects .gitignore
      # and only visits Python files, and -- the point -- it CANNOT emit E902,
      # which only fires for an explicitly named path that does not exist.
      # Naming directories is what broke this workflow the first time, when
      # toolshed/ existed on disk but was never committed (git does not track
      # empty directories).
      - name: Lint
        run: ruff check .

      # The assertion the E902 was standing in for. "The application does not
      # exist" should fail as itself, not disguised as a style error.
      - name: The package must import
        run: python -c "import toolshed, toolshed.__main__; print(toolshed.__version__)"

      - name: Unit tests
        # offscreen: real widgets, no display server needed.
        # -rs reports the reason for any skip, so a test that quietly stops
        # running shows up in the log instead of hiding in the pass count.
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/unit -q -rs

  gpl-boundary:
    # ComfyUI is GPL-3.0-or-later. Toolshed downloads it and drives it as a
    # separate process, and must never import or bundle it. See CONTRIBUTING.md.
    # A hung step must not burn six hours of runner time.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Toolshed must not import or bundle ComfyUI
        # The check itself lives in tools/check_gpl_boundary.sh so it can be
        # tested. Inline here, it could only ever be exercised by pushing and
        # watching -- and a safety check nobody can exercise is a wish.
        run: sh tools/check_gpl_boundary.sh
