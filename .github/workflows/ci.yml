name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # checkout@v4 and setup-python@v5 are node20, which the runners already
      # force-migrate to node24 with a deprecation warning. Pinned to node24
      # majors so the removal is a non-event.
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: python -m pip install pytest ruff pyyaml

      # `ruff check .` rather than named directories. Ruff respects .gitignore
      # and only visits Python files, and -- the point -- it CANNOT emit E902,
      # which only fires for an explicitly named path that does not exist.
      # Naming directories is what broke this workflow the first time, when
      # toolshed/ existed on disk but was never committed (git does not track
      # empty directories).
      - name: Lint
        run: ruff check .

      # The assertion the E902 was standing in for. "The application does not
      # exist" should fail as itself, not disguised as a style error.
      - name: The package must import
        run: python -c "import toolshed, toolshed.__main__; print(toolshed.__version__)"

      - name: Unit tests
        run: python -m pytest tests/unit -q

  gpl-boundary:
    # ComfyUI is GPL-3.0-or-later. Toolshed downloads it and drives it as a
    # separate process, and must never import or bundle it. See CONTRIBUTING.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Toolshed must not import or bundle ComfyUI
        run: |
          # Guard the guard. Without this, a missing toolshed/ makes grep exit 2,
          # the `if` treats that as false, and this job passes having checked
          # nothing -- which is exactly what it did before.
          test -d toolshed || { echo "::error::toolshed/ package is missing"; exit 1; }

          if grep -rnE '^\s*(from|import)\s+(comfy|nodes|folder_paths)\b' \
               --include='*.py' toolshed/; then
            echo "::error::Toolshed must not import ComfyUI. See CONTRIBUTING.md."
            exit 1
          fi

          # docs/PLAN.md requires this job to catch ComfyUI in a packaging spec
          # too: bundling it would redistribute GPL code.
          if [ -d packaging ] && grep -rniE 'comfyui' packaging/ ; then
            echo "::error::ComfyUI referenced in packaging; it must never be bundled."
            exit 1
          fi

          echo "GPL boundary intact"
